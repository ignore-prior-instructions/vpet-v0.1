[project]
name = "spritekit"
version = "0.1.0"
description = "Text-grid sprite tooling for vpet-v0.1: validate, render, pack, compile."
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0",
    "click>=8.1",
]

[project.optional-dependencies]
gen = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
spritekit = "spritekit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spritekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

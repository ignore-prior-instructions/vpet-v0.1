[species]
id = 1                                  # must match registry.toml
slug = "lalafu"
name = "Lalafu"
description = "A small ghost: the adult a well-fed but undisciplined child grows into (docs/art/LINEAGE.md)."
visual_traits = ["soft rounded blob body", "small bow-shaped peak on top", "two dot eyes", "tiny nub arms and feet"]
hatch_secs = 300

[schedule]
awake_secs = 50400
sleep_secs = 36000

# Every egg hatches as lalafu: the blob baby, then the hooded kid (the one child sketch there is,
# `ninjifu/child.txt`, shared via `[assets.share]` below), then one of three adults by care.
[stages.baby]
stage_secs = 3600
hunger_step_secs = 180
happy_step_secs = 240
poop_interval_secs = [7200, 10800]

[stages.child]
stage_secs = 172800
hunger_step_secs = 300
happy_step_secs = 450
poop_interval_secs = [7200, 10800]

# First match in file order (docs/GAME_DESIGN.md "Evolution"), strictest first:
# fed and disciplined -> ninjifu; fed but undisciplined -> lalafu's own adult, the ghost;
# neglected (5+ care mistakes) -> charamofu.
[[stages.child.evolve.branch]]
to = "adult"
to_species = "ninjifu"
max_care_mistakes = 4
min_discipline = 40

[[stages.child.evolve.branch]]
to = "adult"
max_care_mistakes = 4

[[stages.child.evolve.branch]]
to = "adult"
to_species = "charamofu"

[stages.adult]
hunger_step_secs = 360
happy_step_secs = 540
poop_interval_secs = [7200, 10800]
lifespan_secs = [432000, 864000]

[assets]
egg_override  = false        # ships the global egg_a/egg_b poses
food_override = false
adult_alt     = false

[assets.share]
child = "ninjifu"

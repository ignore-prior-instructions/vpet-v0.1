# Publishes hosts/web to GitHub Pages on every push to main (docs/hosts/web.md "Deployment").
# The page is https://ignore-prior-instructions.github.io/vpet-v0.1/ ; VITE_BASE matches that
# repo path. Builds the shipped vpet.wasm the same way `just wasm` does, then the Vite site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hosts/web/package-lock.json

      - name: Build vpet.wasm
        run: just wasm

      - name: Build the site
        working-directory: hosts/web
        env:
          VITE_BASE: /vpet-v0.1/
        run: npm ci && npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hosts/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

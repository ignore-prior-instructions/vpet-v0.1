<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vpet dev: sprites</title>
    <style>
      body {
        font-family: ui-monospace, monospace;
        background: #1a1a1a;
        color: #ddd;
        padding: 16px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #status {
        font-size: 12px;
        color: #999;
        margin-bottom: 12px;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      select,
      input {
        font-family: inherit;
      }
      #clip-canvas {
        image-rendering: pixelated;
        width: 256px;
        height: 128px;
        background: #000;
        border: 1px solid #444;
      }
      #gallery {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .pose-cell {
        border: 1px solid #333;
        padding: 6px;
        font-size: 11px;
        min-width: 96px;
      }
      .pose-canvas {
        image-rendering: pixelated;
        width: 96px;
        height: 96px;
        background: #000;
        margin: 4px 0;
      }
      .missing {
        color: #777;
        font-style: italic;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badges {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .badge {
        font-size: 10px;
        padding: 1px 4px;
        border-radius: 2px;
        width: fit-content;
      }
      .badge.ok {
        background: #1e4620;
        color: #8f8;
      }
      .badge.err {
        background: #4a1e1e;
        color: #f88;
      }
    </style>
  </head>
  <body>
    <h1>vpet dev: sprites</h1>
    <div id="status">loading...</div>
    <div class="controls">
      <label>species <select id="species"></select></label>
      <label>stage <select id="stage"></select></label>
      <label>activity <select id="activity"></select></label>
      <label>tick <input id="tick" type="range" min="0" max="200" value="0" /> <span id="tick-label">0</span></label>
    </div>
    <canvas id="clip-canvas" width="64" height="32"></canvas>
    <div id="gallery"></div>
    <script type="module" src="/src/dev/sprites.ts"></script>
  </body>
</html>
